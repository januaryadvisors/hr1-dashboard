name: Deploy to GitHub Pages

# Build + deploy on every push to main. No manual `npm run deploy` step.
# One-time setup: repo → Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # §2 requires unit tests on the scale/binning/format helpers — those are
      # where a silent error changes what the map claims, so the deploy gates on
      # them. The R parity test self-skips without Rscript on the runner.
      - run: npm test
      # `build` runs tsc --noEmit first, so a type error fails the deploy too.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
